services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      - n8n
    restart: unless-stopped
    networks:
      - bill_network

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - bill_network

networks:
  bill_network:
    driver: bridge

volumes:
  n8n_data:
